name: Deploy Admin (Angular) to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy Angular Admin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Production Bundle
        run: npm run build -- --configuration=production

      - name: Package Browser Build Contents
        run: |
          cd dist/admin/browser
          tar -czf ../../../admin-dist.tar.gz .

      - name: Ensure Target Directory Exists on Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || '195.35.39.62' }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || '65002' }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'u111559603' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY || secrets.ssh_key || secrets.SSH_KEY }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD || secrets.password || 'Cruzazul29.$' }}
          script: |
            mkdir -p /home/u111559603/domains/faceaut.com/public_html/ren-admin

      - name: Upload Package Archive via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || '195.35.39.62' }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || '65002' }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'u111559603' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY || secrets.ssh_key || secrets.SSH_KEY }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD || secrets.password || 'Cruzazul29.$' }}
          source: "admin-dist.tar.gz"
          target: "/home/u111559603/domains/faceaut.com/public_html/ren-admin"
          timeout: 120s

      - name: Extract Build Package directly into ren-admin root
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || '195.35.39.62' }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || '65002' }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'u111559603' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY || secrets.ssh_key || secrets.SSH_KEY }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD || secrets.password || 'Cruzazul29.$' }}
          script: |
            cd /home/u111559603/domains/faceaut.com/public_html/ren-admin
            tar -xzf admin-dist.tar.gz
            rm -f admin-dist.tar.gz
            echo "✅ ¡Archivos compilados desempacados directamente en la raíz del subdominio!"
